<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diwali Globe · Light up the map</title>
  <meta name="description" content="Every light on this globe is a diya someone lit for Diwali. Add yours, burst a cracker above your city, and watch the map fill up.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Light up the map this Diwali">
  <meta property="og:description" content="Every light on this globe is a diya someone lit. Add yours and watch the map fill up, live.">
  <meta property="og:image" content="https://voideepak.github.io/diwali/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#05080f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=069a81ecdc">
</head>
<body>
  <div id="globe"></div>

  <header id="header">
    <div class="title">
      <p class="over"><span class="dot" id="netDot" title="Live"></span>Diwali · live map</p>
      <h1>Shubh <em>Deepavali</em></h1>
      <p class="stats" id="stats"><b id="diyaCount">0</b> <span id="diyaLabel">diyas</span><i></i><b id="crackerCount">0</b> <span id="crackerLabel">crackers</span><i></i><b id="cityCount">0</b> <span id="cityLabel">cities</span></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="camMe">My city</button>
        <button type="button" id="camIndia">India</button>
        <button type="button" id="camWorld">World</button>
      </div>
      <button class="icon-btn board-toggle" id="boardBtn" type="button" aria-label="Brightest cities" title="Brightest cities">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Toggle sound"></button>
    </div>
  </header>

  <div class="intro" id="intro">
    <p id="introText">Finding your city</p>
  </div>

  <aside class="board" id="board" aria-label="Brightest cities">
    <h2>Brightest cities</h2>
    <ol id="boardList"></ol>
    <p class="board-empty" id="boardEmpty">The map is still dark. Light the first diya.</p>
  </aside>

  <section class="panel" id="panel">
    <div class="loc">
      <span id="locLabel">Locating…</span>
      <button class="link" id="locFix" type="button">Not right?</button>
    </div>
    <div class="fields">
      <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname">
      <input id="wishInput" maxlength="100" placeholder="A wish for Diwali (optional)" autocomplete="off">
    </div>
    <div class="actions">
      <button class="btn primary" id="diyaBtn" type="button"><span class="flame"></span>Light a diya</button>
      <button class="btn ghost" id="crackerBtn" type="button">Burst a cracker</button>
    </div>
    <div class="share">
      <span>Every dot is a diya someone lit. Bring your people:</span>
      <a class="link" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
      <button class="link" id="copyBtn" type="button">Copy link</button>
    </div>
    <p class="warn" id="warn" hidden></p>
    <p class="update" id="update" hidden>A newer version of the map is out. <button class="link" id="updateBtn" type="button">Refresh</button></p>
  </section>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="app.js?v=069a81ecdc"></script>
</body>
</html>
