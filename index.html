<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diwali Globe · Light up your city</title>
  <meta name="description" content="Light a diya or burst a cracker above your city, and watch Diwali light up across India and the world, live.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="🪔 Light up your city this Diwali">
  <meta property="og:description" content="Light a diya or burst a cracker above your city and watch the whole world celebrate, live.">
  <meta property="og:image" content="https://voideepak.github.io/diwali/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#05020f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="globe"></div>

  <header id="header">
    <div class="topbar">
      <span class="brand"><span class="dot" id="netDot" title="Network"></span>🪔 Diwali Globe</span>
      <button class="pill-btn" id="muteBtn" type="button" aria-label="Toggle sound">🔊</button>
    </div>
    <h1>Shubh Deepavali</h1>
    <p class="stats" id="stats"><span>🪔 <b id="diyaCount">0</b> <span id="diyaLabel">diyas</span></span><span>🎆 <b id="crackerCount">0</b> <span id="crackerLabel">crackers</span></span><span>📍 <b id="cityCount">0</b> <span id="cityLabel">cities</span></span></p>
  </header>

  <div class="intro" id="intro">
    <p id="introText">Finding your city…</p>
  </div>

  <aside class="board" id="board" aria-label="Brightest cities">
    <h2>🏆 Brightest cities</h2>
    <ol id="boardList"></ol>
    <p class="board-empty" id="boardEmpty">No diyas yet. Light the first one!</p>
  </aside>

  <nav class="cam" aria-label="Camera">
    <button type="button" id="boardBtn" class="board-toggle" title="Brightest cities">🏆</button>
    <button type="button" id="camMe" title="My city">📍</button>
    <button type="button" id="camIndia" title="India">🇮🇳</button>
    <button type="button" id="camWorld" title="Whole world">🌏</button>
  </nav>

  <section class="panel" id="panel">
    <div class="loc">
      <span id="locLabel">📍 Locating…</span>
      <button class="link" id="locFix" type="button">Not right?</button>
    </div>
    <div class="fields">
      <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname">
      <input id="wishInput" maxlength="100" placeholder="Diwali wish (optional)" autocomplete="off">
    </div>
    <div class="actions">
      <button class="primary diya" id="diyaBtn" type="button">🪔 Light a diya</button>
      <button class="primary cracker" id="crackerBtn" type="button">🎆 Burst a cracker</button>
    </div>
    <div class="share">
      <span>Invite friends:</span>
      <a class="link" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
      <span>·</span>
      <button class="link" id="copyBtn" type="button">Copy link</button>
    </div>
    <p class="warn" id="warn" hidden></p>
  </section>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
